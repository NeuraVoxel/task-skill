<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Shapes</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f5;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #fff;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    const LOGICAL = 400;
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function drawShapes() {
      ctx.fillStyle = "#4a90d9";
      ctx.fillRect(80, 60, 240, 160);

      ctx.beginPath();
      ctx.moveTo(200, 40);
      ctx.lineTo(320, 220);
      ctx.lineTo(80, 220);
      ctx.closePath();
      ctx.fillStyle = "#e67e22";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(200, 200, 50, 0, Math.PI * 2);
      ctx.fillStyle = "#9b59b6";
      ctx.fill();
      ctx.strokeStyle = "#8e44ad";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Three differently colored balls
      const balls = [
        { x: 80, y: 320, r: 36, fill: "#e74c3c", stroke: "#c0392b" },
        { x: 200, y: 340, r: 36, fill: "#2ecc71", stroke: "#27ae60" },
        { x: 320, y: 320, r: 36, fill: "#3498db", stroke: "#2980b9" },
      ];

      for (const b of balls) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.fill;
        ctx.fill();
        ctx.strokeStyle = b.stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function render() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w;
      canvas.height = h;

      const scale = Math.min(w, h) / LOGICAL;
      const offsetX = (w - LOGICAL * scale) / 2;
      const offsetY = (h - LOGICAL * scale) / 2;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
      drawShapes();
    }

    window.addEventListener("resize", render);
    render();
  </script>
</body>

</html>
